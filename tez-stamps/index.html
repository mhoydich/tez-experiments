<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tez-stamps — your passport</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="office">
    <p class="eyebrow">tez-stamps · template 02</p>
    <h1>Proof you<br /><em>showed up.</em></h1>
    <p class="lede">Every stamp on this page is a soulbound token —
       earned by doing, bound to your wallet, readable by any app.</p>

    <button id="connect" class="enter">Open my passport</button>

    <section id="passport" hidden>
      <div class="profile-bar">
        <div>
          <p class="mono" id="address"></p>
          <p class="profile-links">
            <button id="copy-address" class="linkish" type="button">copy</button>
            <a id="tzkt-link" href="#" target="_blank" rel="noopener">tzkt</a>
            <a id="share-link" href="#">share passport</a>
          </p>
        </div>
        <button id="disconnect" class="ghost" type="button">Log out</button>
      </div>
      <h2 class="section-label">Stamps</h2>
      <ul id="stamps" class="stamp-grid" aria-label="Your stamps"></ul>
      <div id="claimable"></div>
      <h2 class="section-label">Nouns</h2>
      <div id="nouns" class="noun-shelf"></div>
    </section>

    <p id="status" class="status" role="status"></p>
    <footer><p>Mainnet · CC0 · reads/writes the stamps registry contract</p></footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
